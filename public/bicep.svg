<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Full circular gradient -->
    <linearGradient
      id="completeGradient"
      gradientUnits="userSpaceOnUse"
      x1="256"
      y1="46"
      x2="256"
      y2="466"
    >
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="50%" stop-color="#FBC02D"/>
      <stop offset="100%" stop-color="#43A047"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#111111"/>

  <!-- Full progress ring -->
  <circle
    cx="256"
    cy="256"
    r="210"
    fill="none"
    stroke="url(#completeGradient)"
    stroke-width="26"
    stroke-linecap="round"
    transform="rotate(-90 256 256)"
  />

  <!-- Dumbbell handle -->
  <rect x="176" y="240" width="160" height="32" rx="16" fill="#FFFFFF"/>

  <!-- Left weights (heavier) -->
  <rect x="128" y="186" width="40" height="140" rx="12" fill="#FFFFFF"/>
  <rect x="96"  y="206" width="24" height="100" rx="8"  fill="#FFFFFF"/>

  <!-- Right weights (heavier) -->
  <rect x="344" y="186" width="40" height="140" rx="12" fill="#FFFFFF"/>
  <rect x="392" y="206" width="24" height="100" rx="8"  fill="#FFFFFF"/>
</svg>
